name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip libltdl-dev libffi-dev libssl-dev \
            build-essential ccache autoconf libtool libncurses5 ncurses-dev \
            libreadline-dev libsqlite3-dev zlib1g-dev pkg-config \
            openjdk-17-jdk ant mercurial patch

      - name: Install Android SDK & Accept Licenses
        run: |
          export ANDROID_HOME=$HOME/.android/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          
          # Android Command Line Tools ကို ဒေါင်းလုဒ်လုပ်ခြင်း
          curl -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools.zip -d temp_cmdline
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          mv temp_cmdline/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
          rm -rf commandlinetools.zip temp_cmdline
          
          # SDK လိုင်စင်များအားလုံးကို အလိုအလျောက် သဘောတူလက်ခံခြင်း
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses
          
          # Buildozer လိုအပ်မည့် SDK platforms နဲ့ build-tools များကို အစုံအလင် တပ်ဆင်ခြင်း
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          
          # Buildozer က ရှာတွေ့နိုင်ရန် Build-tools လမ်းကြောင်းကို ချိတ်ဆက်ပေးခြင်း
          echo "$ANDROID_HOME/build-tools/33.0.2" >> $GITHUB_PATH

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install --user cython==0.29.36 buildozer

      - name: Build with Buildozer
        run: ~/.local/bin/buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-suite-apk
          path: bin/*.apk
