name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies (incl i386 libs)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip libltdl-dev libffi-dev libssl-dev \
            build-essential ccache autoconf libtool libncurses5 ncurses-dev \
            libreadline-dev libsqlite3-dev zlib1g-dev pkg-config \
            openjdk-17-jdk ant mercurial patch \
            libc6:i386 libstdc++6:i386 zlib1g:i386 libncurses5:i386

      - name: Install Android SDK, NDK & Accept Licenses
        run: |
          ANDROID_HOME=$HOME/.android/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          curl -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools.zip -d temp_cmdline
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          mv temp_cmdline/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          rm -rf commandlinetools.zip temp_cmdline

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;21.4.7075529" "cmake;3.22.1"

          mkdir -p "$HOME/.buildozer/android/platform"
          rm -rf "$HOME/.buildozer/android/platform/android-sdk"
          ln -s "$ANDROID_HOME" "$HOME/.buildozer/android/platform/android-sdk"

          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/33.0.2" >> $GITHUB_PATH

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install --user cython==0.29.36 buildozer

      - name: Build with Buildozer
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ~/.local/bin/buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-suite-apk
          path: bin/*.apk
